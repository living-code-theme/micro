name: check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 12.9.0, run_install: false }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: living-code-micro
          path: dist/*.tar.gz
          if-no-files-found: error
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch checksum-pinned micro 2.0.15
        run: |
          curl --fail --location --max-time 90 https://github.com/micro-editor/micro/releases/download/v2.0.15/micro-2.0.15-linux64-static.tar.gz -o native.tar.gz
          echo '267d238eac1e26ed053d13d4d48bd421b87f9eb538b604f0b2f74a85598b6cc2  native.tar.gz' | sha256sum --check -
          mkdir native && tar -xzf native.tar.gz -C native
      - name: Render all four themes in real terminals
        run: NATIVE_BINARY="$PWD/native/micro-2.0.15/micro" python3 scripts/test-native.py
