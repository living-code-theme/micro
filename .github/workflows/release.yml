# Registry plugin only. A maintainer creates the tag; the plugin channel consumes the release ZIP URL in repo.json.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 12.9.0, run_install: false }
      - name: Require the tag to match the plugin version
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json')).version")"
          test "$GITHUB_REF_NAME" = "v$version" || { echo 'Tag must match package.json version' >&2; exit 1; }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm package
      - name: Publish the assets required by the plugin channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*.zip dist/repo.json
